name: Tests Workflow

on: [push]

jobs:
  build:
    name: Autograding
    # Skip the first push that creates the default branch from a GitHub template
    if: ${{ !(github.event.created && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prepare to tests
        run: npm ci
      - name: Tests
        run: npm run e2e:headless
